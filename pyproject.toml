[project]
name = "geotech-coverage"
version = "0.1.0"
description = "Coverage map of publicly available geotechnical borings and reports"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "geopandas>=0.14",
  "shapely>=2",
  "pyproj>=3.6",
  "h3>=4",
  "pyarrow>=14",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "mapbox-vector-tile>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "pipeline.sources"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live network access (skipped by default)"]
addopts = "-m 'not network'"
