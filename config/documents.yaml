# Source documents behind Geosetta's non-DOT locations, keyed by Geosetta's file path
# (do_files_json `path`). Each was opened and its title page read (2026-11-24).
#
#   title, author, kind   what the document is
#   site_specific         false = not data about the place it's pinned to (a journal paper or
#                         a proposal geocoded to an office address). Drawn and labelled, but it
#                         doesn't count toward coverage.
#   rights                short reuse label shown on the map (see SPEC §8 "Reuse labels")
#   rights_detail         what we may do with it, and why
#
# Geosetta-sourced data (locations, parsed logs) is also under Geosetta's terms of use whatever
# the document's own status: redistribute only with Geosetta's disclaimer. The PDFs themselves
# are only downloadable from Geosetta with a key, so the map links to the location on Geosetta's
# map and never re-hosts a file.

logs/reports/29.6516;-82.3248.pdf:
