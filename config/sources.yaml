# USGS NWIS groundwater sites (water/monitoring wells with depth). Federal: public domain.
- id: usgs_nwis_gw
  name: USGS NWIS Groundwater Sites
  adapter: usgs_nwis
  url: https://waterservices.usgs.gov/nwis/site/
  homepage: https://waterdata.usgs.gov/
  tier: 1
  kind: geologic_well        # water wells, hidden by default like FGS wells
  license: US federal work (USGS), public domain.
  fixed_type: Well
  doc_label: USGS monitoring-location page
  site_id_prefix: "usgs:"
  field_map:
    native_id: site_no
    site_id: site_no
    boring_name: station_nm
    date: construction_dt
    depth_ft: depth_ft
    elev: alt_va
    doc_url: page_url
  details:
    USGS site: site_no
    Aquifer: nat_aqfr_cd
    Well depth (ft): well_depth_va
    Hole depth (ft): hole_depth_va
  report_key: [site_no]

# SJRWMD well records ("All Wells": well completion / permit stations with depth, casing,
# use, contractor). Despite being SJRWMD's layer, Gainesville records span the whole city,
# including the Suwannee River WMD side (checked 2026-11-16). Many are shallow monitoring wells.
- id: sjrwmd_wells
  name: SJRWMD Well Records
  adapter: arcgis
  url: https://permitting.sjrwmd.com/arcgis02/rest/services/sjrRegMapICR/MapServer/13
  homepage: https://www.sjrwmd.com/data/groundwater/
  where: "1=1"
  tier: 2
  kind: geologic_well        # water/monitoring wells: hidden by default like FGS and USGS
  license: Florida agency public record (St. Johns River Water Management District).
  fixed_type: Well
  approx_when:               # position from a section-township-range centroid: ~1 km off
    MTHD_DTRMN_DSC: [STR Centroid]
  # Wells at one site (e.g. a remediation site's monitoring wells, named "1", "2", ...) often
  # share one coordinate. Keep them all, flagged as site-level positions.
  keep_colocated: true
  flag_colocated: true
  field_map:
    native_id: STN_ID           # stable; OBJECTID is regenerated by the layer's nightly rebuild
    boring_name: STN_NM
    depth_ft: WELL_DEPTH
    gw: INIT_STATIC_WTR_LVL_VAL
    consultant: CNTRCTR_NM
  details:
    Use: WELL_USE_DSC
    Casing depth (ft): WELL_CASING_DEPTH
    Diameter (in): WELL_DIAMETER
    FL unique well ID: FL_UNQ_WELL_ID
    Permit: FULL_APP_NO
    Address: WELL_ADDR
    Location method: MTHD_DTRMN_DSC
  report_key: [FULL_APP_NO]

# SJRWMD Environmental Resource Permits: project-site polygons (stormwater/wetland permits).
# Applications for stormwater systems commonly include soil borings / seasonal high water
# table estimates, so a permit site marks where subsurface data likely exists. Area source:
# counts through the H3 cells it overlaps (see pipeline/areas.py).
- id: sjrwmd_erp
  name: SJRWMD Environmental Resource Permits
  adapter: arcgis
  area: true
  url: https://permitting.sjrwmd.com/arcgis02/rest/services/sjrRegMapICR/MapServer/4
  homepage: https://www.sjrwmd.com/permitting/
  where: "1=1"
  max_offset: 0.00002         # ~2 m geometry generalization on the server
  tier: 2
  kind: permit_site
  license: Florida agency public record (St. Johns River Water Management District).
  fixed_type: Permit
  doc_label: SJRWMD e-Permitting record
  area_group_by: OFFCL_PRMT_ID          # one area per permit; sequences dissolved
  area_exclude: {PRMT_STTS: [Never Issued]}
  area_date: PRMT_DECISION_DT
  max_coverage_acres: 100     # bigger (master/campus permits) are drawn but don't count
  field_map:
    native_id: OFFCL_PRMT_ID
    boring_name: PRMT_PROJ_NM
    doc_url: LINK
  details:
    Permit: OFFCL_PRMT_ID
    Permit type: RULE_TYPE_DESC
    Status: PRMT_STTS
    Applicant: APPLICANT
    Project acres (reported): PROJ_ACRES
    Received: RECV_DT
    Expires: PRMT_EXPIR_DT

# Geosetta area exports (draw an area on geosetta.org's map, export the DIGGS viewer HTML) or
# raw DIGGS XML, saved into import_dir. Parsed logs: depth, SPT N-values, lab tests, lithology.
# Boreholes that match a lower-tier boring (e.g. FDOT) within dedupe_m enrich it instead of
# duplicating it. Geosetta terms: the disclaimer must accompany redistributed outputs.
- id: geosetta_diggs
  name: Geosetta (DIGGS area exports)
  adapter: diggs
  import_dir: data/manual/geosetta
  homepage: https://geosetta.org
  tier: 4
  kind: geotechnical
  license: >-
    Geosetta terms of use: compiled from DOTs, agencies and public sources; parsed values may
    contain transcription errors. Disclaimer must accompany redistributed outputs.
  disclaimer_file: data/manual/geosetta/DISCLAIMER.txt
  keep_colocated: true        # site-level boreholes share a coordinate; don't collapse them
  field_map:
    native_id: uid
    boring_name: name
    type: test_type
    depth_ft: depth_ft
    elev: elev_ft
    gw: groundwater_depth_ft
    doc_name: project
    consultant: provider
    log: log
  report_key: [project]

