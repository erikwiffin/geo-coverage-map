# Source registry. Adding a source is a config change: pick an adapter and map fields.
# Field-map keys are normalized schema columns; values are native field names.
# report_key: list of fields or field-tuples; the first non-null entry wins.

- id: fdot_d2
  name: FDOT District 2 Soil Borings
  adapter: arcgis
  url: https://gis.fdot.gov/arcgis/rest/services/Soil_Boring/D2_Soil_Boring_viewer/MapServer/0
  homepage: https://www.fdot.gov/geotechnical
  where: "1=1"
  # gis.fdot.gov blocks scripted clients (Azure WAF). Save query pages from a browser into this
  # folder and the adapter uses them instead of the network. See README "FDOT access".
  import_dir: data/manual/fdot_d2
  tier: 2
  kind: geotechnical
  license: >-
    Florida agency public record (FDOT). See Microdecisions v. Skinner (Fla. 2d DCA 2004).
    Consultant-authored reports may still carry the consultant's copyright.
  field_map:
    native_id: OBJECTID
    boring_name: BORENUM
    type: TYPE
    date: BOREDATE
    doc_url: DOC_LINK
    doc_name: DOC_NAME
    doc_id: DOC_ID
    project: PROJNUM
    fin: FIN
    # CONSULTANT holds the log PDF's file name and NOTES a sequence number in this layer
    # (profiled 2026-11-16), so neither is mapped.
    elev: ELEV
    gw: GR_WTR
    county: COUNTY
  # DOC_ID is always null and DOC_LINK points at individual log sheets, so the financial
  # project number (FIN) is the report key. FIN appears both as 447962-1-52-01 and
  # 44796215201; normalize to digits.
  report_key: [DOC_ID, FIN, DOC_LINK]
  normalize_fields: {FIN: digits}
  # DOC_LINK targets FDOT's intranet and internal file shares, which are not reachable publicly.
  internal_doc_patterns: ['^https?://dotsd2ww01\.dot\.state\.fl\.us/', '^\\\\']
  # The same PDFs are public as layer attachments (checked 2026-11-16: OBJECTID 117 ->
  # B-12.pdf). With data/manual/fdot_d2/attachments.json saved, borings link straight to the
  # PDF; without it, they link to the feature's attachment listing page.
  attachments_page: true

- id: fgs_wells
  name: Florida Geological Survey Wells
  adapter: arcgis
  url: https://ca.dep.state.fl.us/arcgis/rest/services/OpenData/FGS_WELLS/MapServer/0
  homepage: https://floridadep.gov/fgs
  where: "1=1"
  tier: 2
  kind: geologic_well        # hidden by default in UI and headline stats
  default_on: false
  license: Florida agency public record (FDEP / Florida Geological Survey).
  fixed_type: Well
  field_map:
    native_id: OBJECTID
    boring_name: WELL_NAME
    date: DRILL_DATE
    year: DRILL_YEAR
    depth_ft: TOTAL_DEPTH
    elev: DOCUMENTED_ELEVATION
    doc_url: REPORT_LINK
    consultant: DRILL_COMPANY
    county: COUNTY
  report_key: [REPORT_LINK]

