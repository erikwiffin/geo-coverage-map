# Publishes the web map (web/dist) to GitHub Pages.
#
# The site is built from the pipeline outputs committed in data/processed/. CI does not run the
# Python pipeline: gis.fdot.gov blocks scripted clients and the FDOT/Geosetta inputs are
# browser-saved files. To update the site, run the pipeline locally, commit data/processed/,
# and push.
name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/processed/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run sync-data
      - name: Test (NN correctness/perf and web-vs-pipeline stats consistency)
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
